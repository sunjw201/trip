  .tag-card .close {

  .tag-card .city { font-size: 12px; color: #f0a04b; letter-spacing: 2px; }
  .tag-card .t { font-size: 20px; font-weight: 800; color: #d6567a; margin: 6px 0 4px; }
  .tag-card .meta { font-size: 13px; color: #a98a8a; margin-bottom: 10px; }
  .tag-card .desc { font-size: 13.5px; color: #6b5656; line-height: 1.7; margin-bottom: 18px; }
  .tag-card .go {
